<mat-tab-group [formGroup]="basicFormGroup">
  <mat-tab label="{{ 'gateway.general' | translate }}">
    <ng-container [ngTemplateOutlet]="generalTabContent"/>
    <section class="tb-form-panel no-border no-padding padding-top">
      <div class="tb-form-panel stroked">
        <div class="tb-form-panel-title" translate>gateway.ethercat-master-settings</div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required" tb-hint-tooltip-icon="{{ 'gateway.hints.ethercat.interface' | translate }}">{{ 'gateway.ethercat-interface' | translate }}</div>
          <div class="tb-flex no-gap">
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput formControlName="interface" placeholder="eth1"/>
              <mat-icon matSuffix
                        matTooltipPosition="above"
                        matTooltipClass="tb-error-tooltip"
                        [matTooltip]="'gateway.ethercat-interface-required' | translate"
                        *ngIf="basicFormGroup.get('interface').hasError('required')
                                             && basicFormGroup.get('interface').touched"
                        class="tb-error">
                warning
              </mat-icon>
            </mat-form-field>
          </div>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required" tb-hint-tooltip-icon="{{ 'gateway.hints.ethercat.cycle-time' | translate }}">{{ 'gateway.ethercat-cycle-time' | translate }}</div>
          <div class="tb-flex no-gap">
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput type="number" formControlName="cycleTimeUs" placeholder="1000"/>
            </mat-form-field>
          </div>
        </div>
        <div class="tb-form-row">
          <mat-slide-toggle class="mat-slide" formControlName="useDistributedClocks">
            <mat-label tb-hint-tooltip-icon="{{ 'gateway.hints.ethercat.distributed-clocks' | translate }}">
              {{ 'gateway.ethercat-distributed-clocks' | translate }}
            </mat-label>
          </mat-slide-toggle>
        </div>
      </div>
    </section>
  </mat-tab>
  <mat-tab label="Devices*">
    <tb-ethercat-devices-table formControlName="devices"
                               [gatewayDeviceId]="gatewayDeviceId"
                               [connectorName]="connectorName"/>
  </mat-tab>
</mat-tab-group>
