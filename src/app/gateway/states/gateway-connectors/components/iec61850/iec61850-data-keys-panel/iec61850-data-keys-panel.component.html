<tb-industrial-keys-panel
  [keysFormArray]="keysFormArray"
  [title]="title"
  [addKeyLabel]="isRpc ? 'Add method' : 'Add key'"
  [emptyText]="'No keys configured. Add a key to get started.'"
  [searchFields]="searchFields"
  [sortFields]="sortFields"
  [spreadsheetColumns]="spreadsheetColumns"
  hostSelector="tb-iec61850-data-keys-panel"
  [rowHeaderTpl]="rowHeaderTpl"
  [rowBodyTpl]="rowBodyTpl"
  [applyDisabled]="keysFormArray.invalid || !keysFormArray.dirty"
  (addKeyRequested)="onAddRequested()"
  (deleteKeyRequested)="onDeleteRequested($event)"
  (applyRequested)="onApplyRequested()"
  (cancelRequested)="onCancelRequested()">
</tb-industrial-keys-panel>

<!-- Row header — labeled pairs matching the other industrial panels. -->
<ng-template #rowHeaderTpl let-row let-index="index">
  <div class="tb-flex">
    <div class="title-container tb-flex">{{ isRpc ? 'Method' : 'Key' }}:
      <span class="key-label" tbTruncateWithTooltip>{{ isRpc ? row.get('method')?.value : row.get('tag')?.value }}</span>
    </div>
    <div class="title-container">Reference:
      <span class="key-label" tbTruncateWithTooltip>{{ row.get('reference')?.value }}</span>
    </div>
    <div *ngIf="row.get('fc')?.value" class="title-container">FC:
      <span class="key-label">{{ row.get('fc')?.value }}</span>
    </div>
  </div>
</ng-template>

<ng-template #rowBodyTpl let-row let-index="index">
  <ng-container [formGroup]="row">
    <div class="tb-form-panel no-border no-padding">
      <ng-container *ngIf="!isRpc">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Tag</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="tag" placeholder="analog_input_1"/>
          </mat-form-field>
        </div>
      </ng-container>
      <ng-container *ngIf="isRpc">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Method</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="method" placeholder="setValue"/>
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Operation</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="operation">
              <mat-option value="read">Read</mat-option>
              <mat-option value="write">Write</mat-option>
              <mat-option value="control">Control</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </ng-container>
      <div class="tb-form-row column-xs">
        <div class="fixed-title-width tb-required">Reference</div>
        <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
          <input matInput formControlName="reference" placeholder="GenericIO/GGIO1.AnIn1.mag.f"/>
        </mat-form-field>
      </div>
      <div class="tb-form-row column-xs">
        <div class="fixed-title-width">FC</div>
        <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
          <mat-select formControlName="fc">
            <mat-option *ngFor="let fc of fcOptions" [value]="fc">{{ fc }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="tb-form-row column-xs">
        <div class="fixed-title-width">Value Type</div>
        <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
          <mat-select formControlName="valueType">
            <mat-option [value]="''">Auto</mat-option>
            <mat-option *ngFor="let vt of valueTypes" [value]="vt">{{ vt }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <ng-container *ngIf="!isRpc">
        <!-- Calibration CVA. Hidden for non-numeric value types
             (boolean / string) via the canCalibrate gate. -->
        <tb-calibration-block formControlName="calibration" [canCalibrate]="canCalibrate(row)"/>
        <tb-report-strategy
          class="stroked tb-form-panel"
          [defaultValue]="ReportStrategyDefaultValue.Key"
          formControlName="reportStrategy"
          [isExpansionMode]="true"
        />
      </ng-container>
      <ng-container *ngIf="isRpc && row.get('operation')?.value === 'control'">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width">Control Model</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="controlModel">
              <mat-option *ngFor="let cm of controlModelOptions" [value]="cm.value">{{ cm.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </ng-container>
    </div>
  </ng-container>
</ng-template>
