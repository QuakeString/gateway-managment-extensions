<div class="tb-form-panel no-border no-padding padding-top">
  <mat-toolbar class="mat-mdc-table-toolbar" [class.!hidden]="textSearchMode">
    <div class="mat-toolbar-tools">
      <div class="title-container">
        <span class="tb-master-table-title">S7 PLC Devices</span>
      </div>
      <span class="flex-1"></span>
      <button mat-icon-button
              (click)="addDevice()"
              matTooltip="Add device"
              matTooltipPosition="above">
        <mat-icon>add</mat-icon>
      </button>
      <button mat-icon-button
              (click)="enterFilterMode()"
              matTooltip="Search"
              matTooltipPosition="above">
        <mat-icon>search</mat-icon>
      </button>
    </div>
  </mat-toolbar>
  <mat-toolbar class="mat-mdc-table-toolbar" [class.!hidden]="!textSearchMode">
    <div class="mat-toolbar-tools">
      <button mat-icon-button
              matTooltip="Search"
              matTooltipPosition="above">
        <mat-icon>search</mat-icon>
      </button>
      <mat-form-field class="flex-1">
        <mat-label>&nbsp;</mat-label>
        <input #searchInput matInput
               [formControl]="textSearch"
               placeholder="Enter search"/>
      </mat-form-field>
      <button mat-icon-button (click)="exitFilterMode()"
              matTooltip="Close"
              matTooltipPosition="above">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <div *ngIf="filteredDevices.length === 0 && devices.length === 0" class="tb-form-hint tb-primary-fill tb-flex center">
    No devices configured. Click + to add an S7 PLC device.
  </div>

  <table *ngIf="devices.length > 0" mat-table [dataSource]="filteredDevices" class="mat-elevation-z0">
    <ng-container matColumnDef="deviceName">
      <th mat-header-cell *matHeaderCellDef>Device Name</th>
      <td mat-cell *matCellDef="let device">{{ device.deviceName }}</td>
    </ng-container>

    <ng-container matColumnDef="host">
      <th mat-header-cell *matHeaderCellDef>Host</th>
      <td mat-cell *matCellDef="let device">{{ device.host }}:{{ device.port }}</td>
    </ng-container>

    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>Model</th>
      <td mat-cell *matCellDef="let device">{{ device.model }}</td>
    </ng-container>

    <ng-container matColumnDef="tags">
      <th mat-header-cell *matHeaderCellDef>Tags</th>
      <td mat-cell *matCellDef="let device">{{ getTagCount(device) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let device; let i = index">
        <button mat-icon-button (click)="$event.stopPropagation(); editDevice(getOriginalIndex(device))" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="$event.stopPropagation(); deleteDevice(getOriginalIndex(device))" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button
                (click)="$event.stopPropagation()"
                [matMenuTriggerFor]="deviceMenu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #deviceMenu="matMenu" xPosition="before">
          <button mat-menu-item (click)="exportDevice(getOriginalIndex(device))">
            <mat-icon>file_download</mat-icon>
            <span>Export</span>
          </button>
          <button mat-menu-item (click)="importDevice()">
            <mat-icon>file_upload</mat-icon>
            <span>Import</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="editDevice(getOriginalIndex(row))"
        class="cursor-pointer"></tr>
  </table>
</div>
