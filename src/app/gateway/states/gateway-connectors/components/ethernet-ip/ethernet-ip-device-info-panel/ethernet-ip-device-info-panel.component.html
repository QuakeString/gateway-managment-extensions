<div class="info-panel">
  <div class="panel-header">
    <span class="panel-title">PLC Information</span>
    <span class="flex-spacer"></span>
    <button mat-icon-button (click)="onRefresh()" matTooltip="Refresh" [disabled]="loading">
      <mat-icon [class.spinning]="loading">refresh</mat-icon>
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="32"></mat-spinner>
    <span>Fetching PLC info...</span>
  </div>

  <!-- Error state -->
  <div *ngIf="plcInfo?.error" class="error-message">
    <mat-icon>error_outline</mat-icon>
    <span>{{ plcInfo.error }}</span>
  </div>

  <!-- PLC Info table -->
  <table *ngIf="!loading && getInfoRows().length > 0" class="info-table">
    <tr *ngFor="let row of getInfoRows()">
      <td class="info-label">{{ row.label }}</td>
      <td class="info-value">{{ row.value }}</td>
    </tr>
  </table>

  <!-- Actions -->
  <div class="actions-row" *ngIf="!loading">
    <button mat-stroked-button color="primary" (click)="onSyncTime()"
            *ngIf="isLogix" matTooltip="Sync PLC clock to system time">
      <mat-icon>schedule</mat-icon>
      Sync Time
    </button>
  </div>

  <!-- Module Info Query -->
  <div class="module-query" *ngIf="isLogix">
    <h4>Backplane Module Info</h4>
    <div class="module-row">
      <mat-form-field appearance="outline" class="slot-field">
        <mat-label>Slot</mat-label>
        <input matInput type="number" [(ngModel)]="moduleSlot" min="0" max="16">
      </mat-form-field>
      <button mat-stroked-button color="primary" (click)="onQueryModule()">
        <mat-icon>info_outline</mat-icon>
        Query
      </button>
    </div>

    <table *ngIf="moduleInfoList.length > 0" class="info-table module-table">
      <tr>
        <th>Slot</th><th>Product</th><th>Vendor</th><th>Revision</th><th>Serial</th>
      </tr>
      <tr *ngFor="let mod of moduleInfoList">
        <td>{{ mod.slot }}</td>
        <td>{{ mod.productName || mod.error }}</td>
        <td>{{ mod.vendor }}</td>
        <td>{{ mod.revision }}</td>
        <td>{{ mod.serial }}</td>
      </tr>
    </table>
  </div>
</div>
