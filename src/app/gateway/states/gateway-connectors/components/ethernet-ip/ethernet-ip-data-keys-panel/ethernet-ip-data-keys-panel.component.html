<tb-industrial-keys-panel
  [keysFormArray]="keysFormArray"
  [title]="panelTitle"
  [addKeyLabel]="addKeyTitle"
  [deleteKeyTitle]="deleteKeyTitle"
  [emptyText]="noKeysText"
  [searchFields]="searchFields"
  [sortFields]="sortFields"
  [spreadsheetColumns]="spreadsheetColumns"
  hostSelector="tb-ethernet-ip-data-keys-panel"
  [rowHeaderTpl]="rowHeaderTpl"
  [rowBodyTpl]="rowBodyTpl"
  [applyDisabled]="keysFormArray.invalid || !keysFormArray.dirty"
  (addKeyRequested)="onAddRequested()"
  (deleteKeyRequested)="onDeleteRequested($event)"
  (applyRequested)="onApplyRequested()"
  (cancelRequested)="onCancelRequested()">
</tb-industrial-keys-panel>

<!-- Row header — labeled pairs rendered by the shell in each
     expansion-panel's title bar. -->
<ng-template #rowHeaderTpl let-row let-index="index">
  <div class="tb-flex">
    <div class="title-container tb-flex">{{ isRpc ? 'Method' : 'Key' }}:
      <span class="key-label" tbTruncateWithTooltip>{{ isRpc ? row.get('method')?.value : row.get('tag')?.value }}</span>
    </div>
    <div class="title-container">PLC Tag:
      <span class="key-label">{{ row.get('plcTag')?.value }}</span>
    </div>
    <div *ngIf="isRpc && row.get('valueType')?.value" class="title-container">Type:
      <span class="key-label">{{ row.get('valueType')?.value }}</span>
    </div>
  </div>
</ng-template>

<!-- Row body — per-connector fields inside the expansion content.
     Non-RPC rows drop the calibration CVA block and the per-key
     report strategy. RPC rows just have method / operation / PLC
     Tag / value type. -->
<ng-template #rowBodyTpl let-row let-index="index">
  <ng-container [formGroup]="row">
    <div class="tb-form-panel no-border no-padding">
      <ng-container *ngIf="!isRpc">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Key</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="tag" placeholder="temperature">
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">PLC Tag</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="plcTag"
                   [placeholder]="isSLC ? 'N7:0' : 'Program:MainProgram.Temperature'">
          </mat-form-field>
        </div>
      </ng-container>
      <ng-container *ngIf="isRpc">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Method</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="method" placeholder="readTemperature">
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">Operation</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="operation">
              <mat-option value="read">Read</mat-option>
              <mat-option value="write">Write</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width tb-required">PLC Tag</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlName="plcTag"
                   [placeholder]="isSLC ? 'N7:0' : 'MotorSpeed'">
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width">Value Type</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="valueType">
              <mat-option [value]="null">Auto</mat-option>
              <mat-option *ngFor="let type of dataTypes" [value]="type">{{ type }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </ng-container>
      <ng-container *ngIf="!isRpc">
        <!-- Calibration CVA — single form control carries the persisted
             shape (`{multiplier}` / `{scaling}` / `{}`). EIP has no
             per-key value type so calibration is always offered; the
             backend skips non-numeric PLC returns at read time. -->
        <tb-calibration-block formControlName="calibration"/>
        <tb-report-strategy
          class="stroked tb-form-panel"
          [defaultValue]="ReportStrategyDefaultValue.Key"
          formControlName="reportStrategy"
          [isExpansionMode]="true"
        />
      </ng-container>
    </div>
  </ng-container>
</ng-template>
