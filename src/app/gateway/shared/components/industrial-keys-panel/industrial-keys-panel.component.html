<div #panelRoot class="industrial-keys-panel-root" [class.fullscreen]="isFullscreen">
  <div class="industrial-keys-panel">
    <div class="tb-form-panel no-border no-padding">
      <div class="tb-form-panel-title">{{ title | translate }} ({{ keysFormArray.controls.length }})</div>

      <!-- Toolbar: pill search, sort menu, fullscreen toggle. Hidden
           in fullscreen — the spreadsheet has its own identical
           toolbar and we don't want two stacked. -->
      <div class="header-actions" *ngIf="!isFullscreen">
        <div class="rounded-search">
          <mat-icon class="rounded-search-icon">search</mat-icon>
          <input class="rounded-search-input" type="text" [formControl]="searchControl" [placeholder]="'gateway.keys-search' | translate"/>
          <button *ngIf="searchControl.value" type="button" class="rounded-search-clear" (click)="searchControl.setValue('')">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <button *ngIf="sortFields.length > 0" type="button" mat-icon-button class="header-action-btn"
                [matMenuTriggerFor]="sortMenu"
                [matTooltip]="'gateway.keys-sort' | translate" matTooltipPosition="above">
          <mat-icon>sort</mat-icon>
        </button>
        <button *ngIf="fullscreenSupported && spreadsheetColumns.length > 0" type="button" mat-icon-button class="header-action-btn"
                (click)="toggleFullscreen()"
                [matTooltip]="(isFullscreen ? 'gateway.keys-exit-fullscreen' : 'gateway.keys-fullscreen') | translate"
                matTooltipPosition="above">
          <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
        <mat-menu #sortMenu="matMenu" class="spreadsheet-sort-menu-panel">
          <button mat-menu-item type="button" (click)="setSortField(null)">
            <mat-icon *ngIf="sortField === null">check</mat-icon>
            <span>{{ 'gateway.keys-default-order' | translate }}</span>
          </button>
          <button *ngFor="let f of sortFields" mat-menu-item type="button" (click)="setSortField(f.value)">
            <mat-icon *ngIf="sortField === f.value">{{ sortDirection === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
            <span>{{ f.label | translate }}</span>
          </button>
        </mat-menu>
      </div>
      <div *ngIf="!isFullscreen && searchControl.value && filteredControls.length !== keysFormArray.controls.length"
           class="search-result-info">
        {{ 'gateway.keys-count-of' | translate:{ filtered: filteredControls.length, total: keysFormArray.controls.length } }}
      </div>

      <ng-container *ngIf="!isFullscreen; else spreadsheetMode">
        <div class="tb-form-panel no-border no-padding key-panel"
             *ngIf="displayedControls.length; else noKeys"
             (scroll)="onKeyPanelScroll($event)">
          <div class="tb-form-panel no-border no-padding tb-flex no-flex row center fill-width"
               *ngFor="let item of displayedControls; trackBy: trackByFilteredItem">
            <div class="tb-form-panel stroked tb-flex">
              <ng-container [formGroup]="item.control">
                <mat-expansion-panel class="tb-settings" [expanded]="item.control.getRawValue().id === lastAddedId">
                  <mat-expansion-panel-header class="flex-wrap">
                    <mat-panel-title>
                      <ng-container *ngTemplateOutlet="rowHeaderTpl; context: { $implicit: item.control, index: item.index }"/>
                    </mat-panel-title>
                  </mat-expansion-panel-header>
                  <ng-template matExpansionPanelContent>
                    <ng-container *ngTemplateOutlet="rowBodyTpl; context: { $implicit: item.control, index: item.index }"/>
                  </ng-template>
                </mat-expansion-panel>
              </ng-container>
            </div>
            <button type="button" mat-icon-button
                    (click)="onDeleteClicked(item.index)"
                    [matTooltip]="deleteKeyTitle | translate" matTooltipPosition="above">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
        <ng-template #noKeys>
          <div class="tb-flex no-flex center align-center key-panel">
            <span *ngIf="searchControl.value && keysFormArray.controls.length > 0; else emptyKeys" class="tb-prompt" translate>
              gateway.keys-no-matching
            </span>
            <ng-template #emptyKeys>
              <span class="tb-prompt">{{ emptyText | translate }}</span>
            </ng-template>
          </div>
        </ng-template>
      </ng-container>

      <ng-template #spreadsheetMode>
        <tb-spreadsheet-keys
          [keysFormArray]="keysFormArray"
          [columns]="spreadsheetColumns"
          [searchFields]="searchFields"
          [isFullscreen]="isFullscreen"
          [hostSelector]="hostSelector"
          (fullscreenToggled)="onFullscreenToggled($event)"
          (addRowRequested)="onAddClicked()"
          (deleteRowsRequested)="onSpreadsheetDeleteRowsRequested($event)">
        </tb-spreadsheet-keys>
      </ng-template>
    </div>
  </div>

  <!-- Footer: Add on the left, Cancel + Apply on the right. Matches
       every industrial panel's action bar layout. -->
  <div class="flex justify-between pt-4 footer-actions">
    <button type="button" mat-stroked-button color="primary" (click)="onAddClicked()">
      {{ addKeyLabel | translate }}
    </button>
    <div class="tb-flex flex-end">
      <button mat-button color="primary" type="button" (click)="onCancelClicked()">{{ 'gateway.gw-cancel' | translate }}</button>
      <button mat-raised-button color="primary" type="button"
              (click)="onApplyClicked()"
              [disabled]="applyDisabled">{{ 'gateway.keys-apply' | translate }}</button>
    </div>
  </div>
</div>
