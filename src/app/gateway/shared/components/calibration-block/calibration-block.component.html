<div class="tb-form-panel stroked" *ngIf="canCalibrate" [formGroup]="form">
  <mat-expansion-panel class="tb-settings" [expanded]="mode !== 'none'">
    <mat-expansion-panel-header class="flex-wrap">
      <mat-panel-title>Calibration</mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <div class="tb-form-row column-xs">
        <div class="fixed-title-width">Mode</div>
        <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
          <mat-select formControlName="mode">
            <mat-option value="none">None</mat-option>
            <mat-option value="modifier">Modifier (× / ÷ / + / −)</mat-option>
            <mat-option value="scaling">Scale (linear)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <ng-container *ngIf="mode === 'modifier'">
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width">Type</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <mat-select formControlName="modifierType">
              <mat-select-trigger>
                <div class="tb-flex align-center">
                  <mat-icon class="tb-mat-18" [svgIcon]="ModifierTypesMap.get(form.get('modifierType')!.value)?.icon"></mat-icon>
                  <span>{{ ModifierTypesMap.get(form.get('modifierType')!.value)?.name | translate }}</span>
                </div>
              </mat-select-trigger>
              <mat-option *ngFor="let modifierType of modifierTypes" [value]="modifierType">
                <mat-icon class="tb-mat-20" svgIcon="{{ ModifierTypesMap.get(modifierType)?.icon }}"></mat-icon>
                <span>{{ ModifierTypesMap.get(modifierType)?.name | translate }}</span>
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="tb-form-row column-xs">
          <div class="fixed-title-width">Value</div>
          <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
            <input matInput type="number" step="0.1" formControlName="modifierValue" placeholder="1"/>
          </mat-form-field>
        </div>
      </ng-container>
      <ng-container *ngIf="mode === 'scaling'">
        <ng-container formGroupName="scaling">
          <div class="tb-form-row column-xs">
            <div class="fixed-title-width">Raw Min</div>
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput type="number" formControlName="rawMin">
            </mat-form-field>
          </div>
          <div class="tb-form-row column-xs">
            <div class="fixed-title-width">Raw Max</div>
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput type="number" formControlName="rawMax">
            </mat-form-field>
          </div>
          <div class="tb-form-row column-xs">
            <div class="fixed-title-width">Eng Min</div>
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput type="number" formControlName="engMin">
            </mat-form-field>
          </div>
          <div class="tb-form-row column-xs">
            <div class="fixed-title-width">Eng Max</div>
            <mat-form-field class="tb-flex no-gap" appearance="outline" subscriptSizing="dynamic">
              <input matInput type="number" formControlName="engMax">
            </mat-form-field>
          </div>
        </ng-container>
      </ng-container>
    </ng-template>
  </mat-expansion-panel>
</div>
